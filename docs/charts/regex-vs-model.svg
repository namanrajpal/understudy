<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="Regex baseline vs local model"><rect width="720" height="400" fill="#faf7f2"/><text x="24" y="26" font-size="16" fill="#1a1714" text-anchor="start" font-weight="640">Regex baseline vs local model, renewal date</text><text x="24" y="44" font-size="11.5" fill="#6b625a" text-anchor="start" font-weight="400">the baseline is a real attempt: longhand and numeric dates, expiry wording near a date</text><text x="121" y="70" font-size="10.5" fill="#6b625a" text-anchor="middle" font-weight="400">named end date</text><rect x="66" y="96" width="94.3" height="26" fill="#6b625a" fill-opacity="0.85" rx="2"/><text x="168.26999999999998" y="113.0" font-size="11" fill="#1a1714" text-anchor="start" font-weight="620">86%</text><text x="66" y="92" font-size="9.5" fill="#6b625a" text-anchor="start" font-weight="400">regex</text><text x="271" y="70" font-size="10.5" fill="#6b625a" text-anchor="middle" font-weight="400">auto-renew,</text><text x="271" y="82" font-size="10.5" fill="#6b625a" text-anchor="middle" font-weight="400">notice required</text><rect x="216" y="96" width="110.0" height="26" fill="#6b625a" fill-opacity="0.85" rx="2"/><text x="334.0" y="113.0" font-size="11" fill="#1a1714" text-anchor="start" font-weight="620">100%</text><text x="216" y="92" font-size="9.5" fill="#6b625a" text-anchor="start" font-weight="400">regex</text><text x="421" y="70" font-size="10.5" fill="#6b625a" text-anchor="middle" font-weight="400">anniversary of</text><text x="421" y="82" font-size="10.5" fill="#6b625a" text-anchor="middle" font-weight="400">signature</text><rect x="366" y="96" width="2.0" height="26" fill="#6b625a" fill-opacity="0.85" rx="2"/><text x="376" y="113.0" font-size="11" fill="#1a1714" text-anchor="start" font-weight="620">0%</text><text x="366" y="92" font-size="9.5" fill="#6b625a" text-anchor="start" font-weight="400">regex</text><text x="571" y="70" font-size="10.5" fill="#6b625a" text-anchor="middle" font-weight="400">fiscal year end</text><rect x="516" y="96" width="2.0" height="26" fill="#6b625a" fill-opacity="0.85" rx="2"/><text x="526" y="113.0" font-size="11" fill="#1a1714" text-anchor="start" font-weight="620">0%</text><text x="516" y="92" font-size="9.5" fill="#6b625a" text-anchor="start" font-weight="400">regex</text><text x="24" y="204" font-size="12" fill="#1a1714" text-anchor="start" font-weight="620">Where the baseline scores zero, the renewal date is not in the document at all:</text><text x="24" y="224" font-size="11" fill="#6b625a" text-anchor="start" font-weight="400">• “renews on each anniversary of the date of execution set forth below”, with that date in longhand in the signature block</text><text x="24" y="242" font-size="11" fill="#6b625a" text-anchor="start" font-weight="400">• “coterminous with the Client’s fiscal year”, with the year end in a separate sentence containing no date</text><text x="24" y="266" font-size="11.5" fill="#b23b2e" text-anchor="start" font-weight="620">6 contracts expiring within 90 days return “unknown” from the baseline.</text></svg>
