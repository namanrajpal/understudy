<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="A frontier model authors a runbook once. A small local model executes it over 46 documents on your own machine, producing a renewal calendar, a routing report and a redaction gate."><defs><marker id="a-rule" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L8 4 L0 7.5 z" fill="#4d463f"/></marker><marker id="a-remote" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L8 4 L0 7.5 z" fill="#7fb0e0"/></marker><marker id="a-local" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L8 4 L0 7.5 z" fill="#e0907f"/></marker></defs><text x="40" y="26" font-size="10" fill="#7fb0e0" text-anchor="start" font-weight="680">ONCE, WITH A CAPABLE MODEL</text><text x="820" y="26" font-size="10.5" fill="#a39a90" text-anchor="end" font-weight="400">the only step that needs a large model</text><rect x="40" y="44" width="200" height="70" rx="7" fill="none" stroke="#7fb0e0" stroke-width="1.25"/><text x="140.0" y="77.0" font-size="13.5" fill="#e8e3dc" text-anchor="middle" font-weight="640">frontier model</text><text x="140.0" y="95.0" font-size="10.5" fill="#a39a90" text-anchor="middle" font-weight="400">writes the plan one time</text><rect x="330" y="44" width="200" height="70" rx="7" fill="none" stroke="#7fb0e0" stroke-width="1.25"/><text x="430.0" y="70.0" font-size="13.5" fill="#e8e3dc" text-anchor="middle" font-weight="640" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">runbooks/*.json</text><text x="430.0" y="88.0" font-size="10.5" fill="#a39a90" text-anchor="middle" font-weight="400">steps, output schema, checks,</text><text x="430.0" y="102.0" font-size="10.5" fill="#a39a90" text-anchor="middle" font-weight="400">what to do on failure</text><line x1="240" y1="79.0" x2="323" y2="79.0" stroke="#7fb0e0" stroke-width="1.25" marker-end="url(#a-remote)"/><rect x="24" y="168" width="812" height="134" rx="10" fill="none" stroke="#e0907f" stroke-width="1.25" stroke-dasharray="5 4" opacity="0.75"/><text x="38" y="188" font-size="10" fill="#e0907f" text-anchor="start" font-weight="680">EVERY RUN, ON YOUR MACHINE</text><text x="822" y="188" font-size="10.5" fill="#a39a90" text-anchor="end" font-weight="400">Ollama on loopback. Nothing in corpus/ leaves the machine.</text><line x1="400.0" y1="114" x2="400.0" y2="189" stroke="#7fb0e0" stroke-width="1.25" marker-end="url(#a-remote)"/><text x="412.0" y="159.0" font-size="10.5" fill="#a39a90" text-anchor="start" font-weight="400">read every run</text><rect x="40" y="196" width="180" height="82" rx="7" fill="none" stroke="#4d463f" stroke-width="1.25"/><text x="130.0" y="235.0" font-size="13.5" fill="#e8e3dc" text-anchor="middle" font-weight="640" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">corpus/</text><text x="130.0" y="253.0" font-size="10.5" fill="#a39a90" text-anchor="middle" font-weight="400">46 documents</text><rect x="300" y="196" width="200" height="82" rx="7" fill="none" stroke="#e0907f" stroke-width="1.25"/><text x="400.0" y="228.0" font-size="13.5" fill="#e8e3dc" text-anchor="middle" font-weight="640">local model</text><text x="400.0" y="246.0" font-size="10.5" fill="#a39a90" text-anchor="middle" font-weight="400">one call per document,</text><text x="400.0" y="260.0" font-size="10.5" fill="#a39a90" text-anchor="middle" font-weight="400">supplying the judgment</text><rect x="580" y="196" width="240" height="82" rx="7" fill="none" stroke="#4d463f" stroke-width="1.25"/><text x="700.0" y="228.0" font-size="13.5" fill="#e8e3dc" text-anchor="middle" font-weight="640" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace">out/report.html</text><text x="700.0" y="246.0" font-size="10.5" fill="#a39a90" text-anchor="middle" font-weight="400">renewal calendar, routing report,</text><text x="700.0" y="260.0" font-size="10.5" fill="#a39a90" text-anchor="middle" font-weight="400">redaction gate with a survival scan</text><line x1="220" y1="237.0" x2="293" y2="237.0" stroke="#4d463f" stroke-width="1.25" marker-end="url(#a-rule)"/><line x1="500" y1="237.0" x2="573" y2="237.0" stroke="#4d463f" stroke-width="1.25" marker-end="url(#a-rule)"/><text x="430.0" y="320" font-size="11" fill="#a39a90" text-anchor="middle" font-weight="400">Reasoning that happens once lives in the runbook. Reasoning that happens every run happens on your hardware.</text></svg>